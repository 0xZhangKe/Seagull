name: Fetch sources

on:
  repository_dispatch:
    types:
      - catalog_updated
  schedule:
    - cron: "0 7,14 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seagull-writer
  cancel-in-progress: false
  queue: max

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Test collectors
        run: python3 -m unittest discover -s tests -v

      - name: Prepare archive worktree
        shell: bash
        run: |
          set -euo pipefail
          archive_ref=$(git ls-remote --heads origin refs/heads/archive)
          if [[ -n "$archive_ref" ]]; then
            git fetch --depth=1 --no-tags origin +refs/heads/archive:refs/remotes/origin/archive
            git worktree add --detach archive-worktree origin/archive
          else
            git worktree add --detach archive-worktree
            git -C archive-worktree switch --orphan archive
            git -C archive-worktree rm -rf --ignore-unmatch .
          fi

      - name: Refresh catalog from current configuration
        run: |
          python3 scripts/generate_catalog.py \
            --input opml.xml \
            --ai-sources ai_sources.json \
            --existing archive-worktree/catalog.json \
            --output archive-worktree/catalog.json

      - name: Fetch RSS and AI documents
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'deepseek/deepseek-v3.2' }}
        run: |
          python3 scripts/fetch_sources.py \
            --ai-sources ai_sources.json \
            --archive-root archive-worktree

      - name: Publish fetched documents as an archive snapshot
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git -C archive-worktree add catalog.json source_state.json
          if [[ -d archive-worktree/rss ]]; then
            git -C archive-worktree add rss/
          fi
          if [[ -d archive-worktree/ai ]]; then
            git -C archive-worktree add ai/
          fi
          python3 scripts/publish_archive.py \
            --archive-root archive-worktree \
            --message "archive: fetch RSS and AI feeds"

      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
            --method POST \
            --field event_type=archive_updated
