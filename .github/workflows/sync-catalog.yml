name: Sync catalog

on:
  push:
    branches:
      - main
    paths:
      - opml.xml
      - ai_sources.json
      - prompts/**
      - scripts/ai_sources.py
      - scripts/ai_agent.py
      - scripts/fetch_ai.py
      - scripts/fetch_sources.py
      - scripts/generate_catalog.py
      - scripts/publish_archive.py
      - tests/test_generate_catalog.py
      - tests/test_publish_archive.py
      - .github/workflows/sync-catalog.yml
      - .github/workflows/fetch-rss.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seagull-writer
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Test catalog generator
        run: python3 -m unittest discover -s tests -v

      - name: Prepare archive worktree
        shell: bash
        run: |
          set -euo pipefail
          archive_ref=$(git ls-remote --heads origin refs/heads/archive)
          if [[ -n "$archive_ref" ]]; then
            git fetch --depth=1 --no-tags origin +refs/heads/archive:refs/remotes/origin/archive
            git worktree add --detach archive-worktree origin/archive
          else
            git worktree add --detach archive-worktree
            git -C archive-worktree switch --orphan archive
            git -C archive-worktree rm -rf --ignore-unmatch .
          fi

      - name: Generate catalog
        run: |
          python3 scripts/generate_catalog.py \
            --input opml.xml \
            --ai-sources ai_sources.json \
            --existing archive-worktree/catalog.json \
            --output archive-worktree/catalog.json

      - name: Publish catalog as an archive snapshot
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git -C archive-worktree add catalog.json
          python3 scripts/publish_archive.py \
            --archive-root archive-worktree \
            --message "catalog: sync from main@${GITHUB_SHA::7}"

      # Prompt-only changes do not alter catalog.json but still need a new collection.
      - name: Trigger source fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
            --method POST \
            --field event_type=catalog_updated
